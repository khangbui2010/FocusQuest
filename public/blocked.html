<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Shield — Focus Quest</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    #blocked-card {
      opacity: 0;
      transition: opacity 80ms ease-out;
    }
    #blocked-card[data-ready="true"] {
      opacity: 1;
    }
    .shield-icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div id="blocked-card" class="card">
    <div class="shield-icon">🛡️</div>
    <h1 id="blocked-title">Focus Quest Active</h1>
    <p id="blocked-desc">This website is not on your active Focus Profile's allowlist. Keep your focus steady and conquer your mission!</p>
    <div id="blocked-badge" class="badge">Allowlist-Only Protection</div>
  </div>
  <script type="module" src="blocked.js"></script>
</body>
</html>
